<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CovenantGO</title>
  <meta name="description" content="CovenantGO connects Creators with TikTok GO hospitality partners for content days." />
  <meta name="theme-color" content="#0b0b10" />

  <!-- iPhone "Add to Home Screen" support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CovenantGO" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="stylesheet" href="css/styles.css?v=28" />
  <script>
    // Apply the saved Light/Dark choice before the page draws (avoids a flash).
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('cg_theme') || 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <a class="brand" id="brand" href="#/discover" aria-label="CovenantGO for TikTok GO Creators, home"></a>
  </header>
  <aside id="adbar" class="adbar" aria-label="Sponsored" hidden></aside>
  <div id="app" aria-live="polite"></div>

  <nav id="tabbar" class="tabbar" hidden>
    <a href="#/discover" data-tab="discover" title="Discover" aria-label="Discover">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Discover</span>
    </a>
    <a href="#/showcase" data-tab="showcase" title="Showcase" aria-label="Showcase">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M10.5 9.5v5l4-2.5z"/></svg>
      <span>Showcase</span>
    </a>
    <a href="#/learn" data-tab="learn" title="Learn" aria-label="Learn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/></svg>
      <span>Learn</span>
    </a>
    <a href="#/my-days" data-tab="my-days" title="Saved" aria-label="Saved">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Saved</span>
    </a>
    <a href="#/pricing" data-tab="pricing" class="tab-desktop" title="Pricing" aria-label="Pricing">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
      <span>Pricing</span>
    </a>
    <a href="#/rewards" data-tab="rewards" class="tab-desktop" title="Rewards" aria-label="Rewards">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      <span>Rewards</span>
    </a>
    <a href="#/profile" data-tab="profile" title="Profile" aria-label="Profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script type="module" src="js/app.js?v=28"></script>
</body>
</html>
